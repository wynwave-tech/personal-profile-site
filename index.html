<!doctype html>
<html lang="en">
  <head>
    <!-- ===================================================== -->
    <!-- Basic -->
    <!-- ===================================================== -->

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Personal Profile Site</title>

    <meta
      name="description"
      content="A customizable personal profile featuring photos, profile details, badges, and expandable content."
    />

    <meta name="author" content="Example Profile" />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://example.com/" />

    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- ===================================================== -->
    <!-- Favicons -->
    <!-- ===================================================== -->

    <link rel="icon" href="/favicon.ico" sizes="any" />

    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/site.webmanifest" />

    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- ===================================================== -->
    <!-- Theme -->
    <!-- ===================================================== -->

    <meta name="theme-color" content="#090A0D" />
    <meta name="color-scheme" content="dark" />

    <!-- ===================================================== -->
    <!-- Open Graph (Facebook, iMessage, Discord, Slack) -->
    <!-- ===================================================== -->

    <meta property="og:type" content="website" />

    <meta property="og:site_name" content="Example Profile" />

    <meta property="og:title" content="Example Profile" />

    <meta
      property="og:description"
      content="A customizable personal profile featuring photos, profile details, badges, and expandable content."
    />

    <meta
      property="og:url"
      content="https://example.com/"
    />

    <meta
      property="og:image"
      content="https://example.com/social-preview.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://example.com/social-preview.png"
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta property="og:image:type" content="image/png" />

    <meta
      property="og:image:alt"
      content="Example Profile social preview"
    />

    <meta property="og:locale" content="en_US" />

    <!-- ===================================================== -->
    <!-- X (Twitter) -->
    <!-- ===================================================== -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Example Profile"
    />

    <meta
      name="twitter:description"
      content="A sample personal profile."
    />

    <meta
      name="twitter:image"
      content="https://example.com/social-preview.png"
    />

    <meta
      name="twitter:image:alt"
      content="Example Profile social preview"
    />

    <meta
      name="twitter:url"
      content="https://example.com/"
    />

  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
